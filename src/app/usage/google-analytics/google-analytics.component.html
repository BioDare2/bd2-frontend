<div>
    <h3>Number of users per country</h3>
    (last 12 months)
    <div class="row">
        <div class="col-sm-8">
            <div id="chart_div" style="width: 100%; height: 400px;"></div>
        </div>
        <div class="col-sm-4">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Country</th>
                        <th>Active users</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let country of topCountries">
                        <td>{{ country.country }}</td>
                        <td>{{ country.activeUsers | number }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
