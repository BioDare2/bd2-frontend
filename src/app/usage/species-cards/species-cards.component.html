<h3>Species on BioDare2</h3>
<small>Click the cards for more details!</small>

<div class="species-cards">
  @for (species of speciesData; track species) {
    <bd2-species-card
      [name]="species.name"
      [image]="species.image"
      [reference]="species.reference"
      [datasets]="species.sets"
      [publicDatasets]="species.public_sets"
      [timeseries]="species.series"
      [publicTimeseries]="species.public_series"
      [keywords]="species.keywords">
    </bd2-species-card>
  }
</div>
