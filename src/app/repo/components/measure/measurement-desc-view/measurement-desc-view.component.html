@if (model) {
  <div>
    @if (model.technique) {
      <div>
        <strong>Technique:</strong> {{ model.technique}}
        {{model.equipment ? '(' + model.equipment + ')' : ''}}
        @if (model.description) {
          <div>
            <strong>Details</strong>
            <div>{{model.description}}</div>
          </div>
        }
      </div>
    }
    @if (!model.technique) {
      <div>
        Unspecified
      </div>
    }
  </div>
}
