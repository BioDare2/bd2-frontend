@if (point && xScale) {
    <svg:rect #box
    [attr.x]="xPosition"
    [attr.y]="yPosition"
    [attr.width]="xWidth"
    [attr.height]="yHeight" [attr.fill]="colorScale(point.y)"
    [attr.stroke]="colorScale(point.y)"
    [attr.fill]="pattern ? 'url(#' + pattern + ')' : colorScale(point.y)"
    ></svg:rect>
  }
